name: Karate API Tests - Seleccionable

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag_to_test:
        description: 'Tag de Karate a ejecutar (ej: @happypath)'
        required: true
        default: '@happypath'
        type: choice
        options:
          - '@happypath'
          - '@unhappypath'
          - '@regresion'

jobs:

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Validar y descargar dependencias
        run: mvn -B dependency:go-offline

  deploy:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Desplegar a ambiente de pruebas
        run: |
          echo "Aquí va tu script/acción real de despliegue"

  test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar Pruebas Karate
        run: |
          TAG=${{ github.event.inputs.tag_to_test || '@happypath' }}
          mvn test "-Dkarate.options=--tags $TAG" -Dkarate.parallel=1

      - name: Subir reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: karate-reports
          path: target/karate-reports/
          if-no-files-found: warn

  finalize:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Descargar reporte
        uses: actions/download-artifact@v7
        with:
          name: karate-reports
          path: reports/
        continue-on-error: true

      - name: Notificar resultado
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ Pruebas exitosas, notificar a Slack/Teams aquí"
          else
            echo "❌ Pruebas fallaron, alertar al equipo aquí"
          fi
