name: Karate API Tests - Seleccionable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag_to_test:
        description: 'Tag de Karate a ejecutar '
        required: true
        default: '@happypath'
        type: choice
        options:
          - '@happypath'
          - '@unhappypath'
          - '@regresion'

jobs:

  # ---------- PASO 1: Preparar el ambiente ----------
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Validar y compilar clases de prueba
        run: mvn -B test-compile

  # ---------- PASO 2: Proceso de Pruebas ----------
  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Ejecutar Pruebas Karate
        run: |
          TAG=${{ github.event.inputs.tag_to_test || '@happypath' }}
          mvn test "-Dkarate.options=--tags $TAG" -Dkarate.parallel=1
      - name: Subir reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: karate-reports
          path: target/karate-reports/
          if-no-files-found: warn

  # ---------- PASO 3: Generar Reporte ----------
  finalize:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para que la acción pueda crear/actualizar la rama gh-pages
    steps:
      - name: Descargar reporte
        uses: actions/download-artifact@v7
        with:
          name: karate-reports
          path: reports/
        continue-on-error: true

      - name: Preparar index.html para GitHub Pages
        if: always()
        run: |
          echo "Archivos disponibles en reports/:"
          ls -la reports/
          if [ -f reports/karate-summary.html ]; then
            cp reports/karate-summary.html reports/index.html
            echo "index.html creado correctamente"
          else
            echo "ADVERTENCIA: no se encontró karate-summary.html, revisa el listado de arriba"
          fi

      - name: Publicar reporte en GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/
          
      - name: Notificar resultado
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ Pruebas exitosas"
          else
            echo "❌ Pruebas fallaron"
          fi
